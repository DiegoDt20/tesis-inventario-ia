{% extends 'base.html' %}
{% load inventario_extras %}

{% block titulo %}Pedidos{% endblock %}

{% block contenido %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
    <div>
        <h1 class="titulo-pantalla"><i class="bi bi-cart3 me-2"></i>Pedidos</h1>
        <p class="titulo-pantalla-detalle">Una fila por producto pedido, no por pedido: así se compara de un vistazo.</p>
    </div>
    <a href="{% url 'inventario:pedido_nuevo' %}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Nuevo pedido
    </a>
</div>

<form class="row g-2 align-items-end mb-3"
      hx-get="{% url 'inventario:pedido_lista' %}" hx-target="#zona-resultados-pedidos"
      hx-swap="innerHTML swap:150ms" hx-push-url="true" hx-indicator="#indicador-filtro-pedidos">
    <div class="col-auto">
        <label class="form-label small mb-0" for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" value="{{ fecha|date:'Y-m-d' }}" class="form-control form-control-sm">
    </div>
    <div class="col-auto">
        <label class="form-label small mb-0" for="estado">Estado</label>
        <select id="estado" name="estado" class="form-select form-select-sm">
            <option value="">Todos</option>
            {% for valor, etiqueta in estados %}
                <option value="{{ valor }}" {% if estado == valor %}selected{% endif %}>{{ etiqueta }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-primary btn-sm">
            <i class="bi bi-funnel me-1 icono-htmx"></i>
            <span class="spinner-border spinner-htmx" id="indicador-filtro-pedidos" aria-hidden="true"></span>
            Filtrar
        </button>
        <a href="{% url 'inventario:pedido_lista' %}" class="btn btn-outline-secondary btn-sm"
           hx-get="{% url 'inventario:pedido_lista' %}" hx-target="#zona-resultados-pedidos"
           hx-swap="innerHTML swap:150ms" hx-push-url="true">
            <i class="bi bi-x-lg me-1"></i>Limpiar
        </a>
    </div>
</form>

<div id="zona-resultados-pedidos" class="zona-resultados">
    {% include 'inventario/_pedido_lista_resultados.html' %}
</div>
{% endblock %}
