# Corre la suite de tests en cada push y pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostgreSQL con la extensión pgvector (la usa el asistente).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: inventario
          POSTGRES_PASSWORD: inventario
          POSTGRES_DB: inventario_ia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventario"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores solo para la base efímera de este trabajo; no son secretos.
      SECRET_KEY: clave-solo-para-ci
      DEBUG: 'False'
      DB_NAME: inventario_ia
      DB_USER: inventario
      DB_PASSWORD: inventario
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-minimos.txt
      - name: Instalar dependencias (PyTorch solo CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-minimos.txt
      - name: Comprobar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test inventario
